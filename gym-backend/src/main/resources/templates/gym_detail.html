<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gym Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gym Management</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0" th:text="${gym.name}">Gym Name</h2>
            </div>
            <div class="card-body">
                <p><strong>Location:</strong> <span th:text="${gym.location}">Location</span></p>
                <p><strong>Price:</strong> $<span th:text="${gym.price}">0</span></p>
                <p><strong>Description:</strong> <span th:text="${gym.description ?: 'No description available.'}">Description</span></p>
                
                <hr>
                <h4>Book this Gym</h4>
                <p class="text-muted small">Please select a user to simulate booking (for demo purposes).</p>
                <form action="/book" method="post" class="row g-3">
                    <input type="hidden" name="gymId" th:value="${gym.id}">
                    <div class="col-auto">
                        <select name="userId" class="form-select" required>
                            <option value="1">Alice</option>
                            <option value="2">Bob</option>
                            <option value="3">Charlie</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-success">Book Now</button>
                    </div>
                </form>
                <div class="mt-3">
                    <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
